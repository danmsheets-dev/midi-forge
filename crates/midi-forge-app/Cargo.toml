[package]
name = "midi-forge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Midi-Forge desktop shell"

[[bin]]
name = "midi-forge"
path = "src/main.rs"

[dependencies]
midi-forge-core.workspace = true
midi-forge-io.workspace = true
midi-forge-script.workspace = true
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1.0.4"
rmcp = { version = "3.1.4", features = ["server", "client", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "schemars"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "io-std", "net", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
